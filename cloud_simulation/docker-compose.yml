version: "3.9"

services:
  api_server:
    build: ./api_server
    container_name: api_server
    ports:
      - "5000:5000"
    depends_on:
      - auth_service
      - payment_service
    networks:
      - cloud_net

  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "5001:5000"
    networks:
      - cloud_net

  payment_service:
    build: ./payment_service
    container_name: payment_service
    ports:
      - "5002:5000"
    networks:
      - cloud_net

networks:
  cloud_net:
    driver: bridge